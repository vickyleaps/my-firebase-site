<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港基本法問答題</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center p-4">

  <div class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-700 space-y-6">
    
    <div class="flex justify-between items-center text-sm text-slate-400">
      <button onclick="window.location.href='login.html?target=bl'" class="hover:text-white">← 切換使用者</button>
      <div id="user-display"></div>
    </div>

    <h1 class="text-2xl font-bold text-center text-emerald-400">香港基本法問答題</h1>

    <div class="bg-slate-700/50 p-5 rounded-xl border border-slate-600">
      <h2 id="question-title" class="text-lg font-semibold text-slate-100 whitespace-pre-line mb-2">載入題目中...</h2>
    </div>

    <div id="options-container" class="space-y-3"></div>

    <button id="next-btn" onclick="handleNextQuestion()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white transition hidden">
      下一題
    </button>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedAnswer = null;

    const currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: '訪客', email: 'guest@local', isGuest: true };
    document.getElementById('user-display').innerText = `參與者：${currentUser.name} (${currentUser.email})`;

    async function loadQuestions() {
      try {
        const querySnapshot = await getDocs(collection(db, "questions_bl"));
        querySnapshot.forEach((doc) => {
          questions.push(doc.data());
        });

        questions.sort(() => Math.random() - 0.5);
        questions = questions.slice(0, 15);

        renderQuestion();
      } catch (err) {
        document.getElementById('question-title').innerText = "載入題目失敗：" + err.message;
      }
    }

    function renderQuestion() {
      selectedAnswer = null;
      const nextBtn = document.getElementById('next-btn');
      nextBtn.classList.add('hidden');

      if (currentIndex >= questions.length) {
        finishQuiz();
        return;
      }

      const q = questions[currentIndex];
      document.getElementById('question-title').innerText = `第 ${currentIndex + 1} 題：${q.question}`;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      // ✅ 加上 .sort() 確保永遠按 A, B, C, D 順序排列
      Object.keys(q.options).sort().forEach(key => {
        const optBtn = document.createElement('button');
        optBtn.className = "w-full text-left p-4 rounded-xl bg-slate-700/80 hover:bg-slate-600 border border-slate-600 flex items-center space-x-3 transition";
        optBtn.innerHTML = `<span class="w-6 h-6 rounded-full border border-slate-400 flex items-center justify-center text-xs font-bold">${key}</span> <span>${q.options[key]}</span>`;
        
        optBtn.onclick = () => {
          document.querySelectorAll('#options-container button').forEach(b => b.classList.remove('border-emerald-500', 'bg-emerald-950/40'));
          optBtn.classList.add('border-emerald-500', 'bg-emerald-950/40');
          selectedAnswer = key;
          nextBtn.classList.remove('hidden');
          nextBtn.innerText = currentIndex === questions.length - 1 ? "提交答案，完成問答" : "下一題";
        };

        container.appendChild(optBtn);
      });
    }

    window.handleNextQuestion = async function() {
      if (selectedAnswer === questions[currentIndex].answer) {
        score++;
      }

      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        await finishQuiz();
      }
    };

    async function finishQuiz() {
      const container = document.querySelector('.space-y-6');
      container.innerHTML = `
        <div class="text-center py-8 space-y-4">
          <h2 class="text-3xl font-extrabold text-emerald-400">測驗完成！</h2>
          <p class="text-xl text-slate-200">得分：<span class="text-emerald-400 font-bold">${score}</span> / ${questions.length}</p>
          <button onclick="window.location.href='login.html?target=bl'" class="mt-4 px-6 py-2.5 bg-emerald-600 rounded-lg text-white font-bold">返回首頁</button>
        </div>
      `;

      if (!currentUser.isGuest) {
        try {
          await addDoc(collection(db, "history"), {
            userName: currentUser.name,
            userEmail: currentUser.email,
            quizType: "香港基本法",
            score: score,
            totalQuestions: questions.length,
            timestamp: serverTimestamp()
          });
        } catch (e) {
          console.error("儲存紀錄失敗:", e);
        }
      }
    }

    loadQuestions();
  </script>
</body>
</html>
