                    question_text: "根據《香港基本法》第三十八條，香港居民享有香港特別行政區法律保障的： 1. 其他權利 2. 自由 3. 特權 4. 豁免權",
                    options: { A: "1, 2", B: "1, 3", C: "2, 4", D: "1, 2, 3, 4" },
                    correct_answer: "A"
                },
                {
                    id: 39, article_number: 39, question_type: "single",
                    question_text: "根據《香港基本法》第三十九條，《公民權利和政治權利國際公約》、《經濟、社會與文化權利的國際公約》和國際勞工公約適用於香港的有關規定繼續有效，通過什麼方式予以實施？",
                    options: { A: "香港特別行政區的法律", B: "全國性法律", C: "行政長官命令", D: "國際法庭裁決" },

                },
                {
                    id: 40, article_number: 40, question_type: "composite",
                    question_text: "根據《香港基本法》第四十條，“新界”原居民的哪些傳統權益受香港特別行政區的保護？ 1. 土地權益 2. 丁屋權益 3. 合法傳統權益 4. 政治特權",
                    options: { A: "1, 2", B: "1, 3", C: "3", D: "1, 2, 3" },
                    correct_answer: "C"
                }
            ];
        }

        // 預覽按鈕事件
        document.getElementById('previewBtn').addEventListener('click', function() {
            const resultCard = document.getElementById('resultCard');
            const statusAlert = document.getElementById('statusAlert');
            const jsonOutput = document.getElementById('jsonOutput');

            resultCard.style.display = 'block';
            statusAlert.style.display = 'none';
            document.getElementById('resultCardHeader').textContent = "資料預覽：第 1 批 (1-40條)";

            const data = getPart1Questions();
            jsonOutput.textContent = JSON.stringify(data, null, 4);
        });

        // 匯入按鈕事件 (直接寫入 Firestore questions_bl)
        document.getElementById('importBtn').addEventListener('click', async function() {
            const resultCard = document.getElementById('resultCard');
            const statusAlert = document.getElementById('statusAlert');
            const jsonOutput = document.getElementById('jsonOutput');
            const configInput = document.getElementById('firebaseConfig').value.trim();

            resultCard.style.display = 'block';
            statusAlert.style.display = 'block';

            if (!configInput) {
                statusAlert.className = "alert alert-danger";
                statusAlert.textContent = "錯誤：請先貼上你的 Firebase Config 設定！";
                return;
            }

            let firebaseConfig;
            try {
                firebaseConfig = JSON.parse(configInput);
            } catch (e) {
                statusAlert.className = "alert alert-danger";
                statusAlert.textContent = "錯誤：Firebase Config 格式不正確，必須是有效的 JSON 格式。";
                return;
            }

            statusAlert.className = "alert alert-warning";
            statusAlert.textContent = "正在連線至 Firebase 並寫入資料至 `questions_bl`...";

            try {
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const questions = getPart1Questions();

                let successCount = 0;
                // 逐筆以文件 ID (對應題目 id) 寫入 Firestore 集合 questions_bl
                for (const q of questions) {
                    const docRef = doc(db, "questions_bl", String(q.id));
                    await setDoc(docRef, q);
                    successCount++;
                }

                statusAlert.className = "alert alert-success";
                statusAlert.textContent = `成功！第 1 批 (1-40題) 已全數寫入 Firestore 的 \`questions_bl\` 集合！`;
                jsonOutput.textContent = JSON.stringify({
                    status: "success",
                    collection: "questions_bl",
                    total_imported: successCount,
                    timestamp: new Date().toISOString()
                }, null, 4);

            } catch (error) {
                statusAlert.className = "alert alert-danger";
                statusAlert.textContent = `寫入失敗：${error.message}`;
                jsonOutput.textContent = JSON.stringify({
                    error_code: error.code,
                    error_message: error.message
                }, null, 4);
            }
        });
    </script>
</body>
</html>
