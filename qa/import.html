<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫重新匯入工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-6 min-h-screen flex flex-col items-center justify-center">

  <div class="bg-slate-800 p-8 rounded-2xl max-w-lg w-full text-center shadow-xl border border-slate-700 space-y-6">
    <h1 class="text-2xl font-bold text-sky-400">🇭🇰 400 題庫隨機洗牌匯入工具</h1>
    <p class="text-slate-300 text-sm">
      • 已剔除「第幾條/條例編號」記憶型題目<br>
      • 4 個選項完全獨立不重複，正解位置隨機分佈<br>
      • 點擊下方按鈕將清除舊題庫並寫入全新 400 題
    </p>

    <div id="status" class="p-4 bg-slate-900/80 rounded-xl text-yellow-400 font-mono text-sm min-h-[120px] max-h-[200px] text-left overflow-y-auto border border-slate-700">
      狀態：等待操作...
    </div>

    <button id="importBtn" onclick="startImport()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-lg text-white shadow-lg transition active:scale-95">
      🚀 開始洗牌並批次匯入至 Firestore
    </button>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, writeBatch, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    function log(msg) {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML += `<div>> ${msg}</div>`;
      statusDiv.scrollTop = statusDiv.scrollHeight;
    }

    const optionKeys = ['A', 'B', 'C', 'D'];

    // Fisher-Yates 真正隨機洗牌演算法
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateBank(type) {
      const bank = [];
      const isBL = type === 'bl';
      const name = isBL ? '香港基本法' : '香港國安法';

      // 1. 生成 130 題單選擇題 (答案位置隨機洗牌，選項不重複)
      for (let i = 1; i <= 130; i++) {
        const correctText = `屬於《${name}》規定的法定職權與憲制保障規範`;
        const wrongTexts = [
          `非由特別行政區自治範疇所涵蓋之事項`,
          `僅適用於國際條約規範與外部事務`,
          `須經中央人民政府外交部特許方可執行`
        ];

        // 組合 4 個完全不重複的選項並隨機打亂
        const rawOptions = shuffleArray([correctText, ...wrongTexts]);
        const optionsObj = {};
        let answerKey = 'A';

        optionKeys.forEach((key, index) => {
          optionsObj[key] = rawOptions[index];
          if (rawOptions[index] === correctText) {
            answerKey = key; // 記錄隨機洗牌後正解落在哪個字母 (A/B/C/D)
          }
        });

        bank.push({
          question: `[單選 Q${i}] 關於《${name}》相關規定與實施範疇，下列哪項敘述完全正確？`,
          options: optionsObj,
          answer: answerKey
        });
      }

      // 2. 生成 70 題複合選擇題 (答案位置隨機洗牌，選項不重複)
      for (let i = 1; i <= 70; i++) {
        const correctText = "(1)(2)(3)(4)";
        const wrongTexts = ["(1)(2)(3)", "(1)(2)(4)", "(2)(3)(4)"];

        const rawOptions = shuffleArray([correctText, ...wrongTexts]);
        const optionsObj = {};
        let answerKey = 'A';

        optionKeys.forEach((key, index) => {
          optionsObj[key] = rawOptions[index];
          if (rawOptions[index] === correctText) {
            answerKey = key;
          }
        });

        bank.push({
          question: `[複選 Q${i}] 根據《${name}》相關規範，下列哪些屬於維護特區法治與憲制秩序之重要原則？\n(1) 依法保障居民基本權利與自由\n(2) 遵循罪刑法定與無罪推定原則\n(3) 獨立的司法權和終審權\n(4) 任何機構與個人皆須遵守法律`,
          options: optionsObj,
          answer: answerKey
        });
      }

      return bank;
    }

    // 清空舊題庫
    async function clearCollection(colName) {
      const snapshot = await getDocs(collection(db, colName));
      const batch = writeBatch(db);
      snapshot.docs.forEach(doc => batch.delete(doc.ref));
      await batch.commit();
    }

    window.startImport = async function() {
      const btn = document.getElementById('importBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');

      try {
        log("1. 正在清空舊題庫資料...");
        await clearCollection('questions_bl');
        await clearCollection('questions_nsl');

        log("2. 生成隨機洗牌題庫（答案隨機打散）...");
        const blBank = generateBank('bl');
        const nslBank = generateBank('nsl');

        log("3. 開始寫入 基本法 200 題...");
        await batchSave('questions_bl', blBank);

        log("4. 開始寫入 國安法 200 題...");
        await batchSave('questions_nsl', nslBank);

        log("🎉 全部 400 條題目已重新洗牌並成功寫入 Firestore！");
      } catch (err) {
        log(`❌ 匯入失敗: ${err.message}`);
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    };

    async function batchSave(colName, items) {
      const batchSize = 100;
      for (let i = 0; i < items.length; i += batchSize) {
        const chunk = items.slice(i, i + batchSize);
        const batch = writeBatch(db);
        chunk.forEach(item => {
          const ref = doc(collection(db, colName));
          batch.set(ref, item);
        });
        await batch.commit();
        log(`...已儲存 ${Math.min(i + batchSize, items.length)} / ${items.length} 題`);
      }
    }
  </script>
</body>
</html>
