<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>題目批量匯入工具</title>
</head>
<body>
  <h2>Firestore 題目庫批量匯入</h2>
  <button id="importNsl">匯入 香港國安法 題目庫</button>
  <button id="importBl">匯入 香港基本法 題目庫</button>
  <p id="status"></p>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 範例資料結構（實際使用時可將 150 題放在 JSON 檔匯入）
    const sampleNslQuestions = [
      {
        id: "q001",
        type: "single",
        question: "《香港國安法》於哪一年哪一月哪一日在香港特區實施？",
        options: { A: "2020年6月30日", B: "2020年7月1日", C: "2019年10月1日", D: "2021年1月1日" },
        answer: "A"
      },
      {
        id: "q101",
        type: "multiple",
        question: "根據《香港國安法》，以下哪些屬於維護國家安全四大罪行？\n(1) 分裂國家罪\n(2) 顛覆國家政權罪\n(3) 恐怖活動罪\n(4) 勾結外國或者境外勢力危害國家安全罪",
        options: { A: "只有 (1)(2) 正確", B: "只有 (2)(3)(4) 正確", C: "只有 (1)(3)(4) 正確", D: "全部 (1)(2)(3)(4) 正確" },
        answer: "D"
      }
    ];

    async function uploadQuestions(collectionName, data) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "正在上傳...";
      try {
        for (const q of data) {
          // 以 q001, q002 等作為 Document ID 寫入資料庫
          await setDoc(doc(db, collectionName, q.id), q);
        }
        statusEl.innerText = `上傳成功！已匯入至 ${collectionName}`;
      } catch (err) {
        statusEl.innerText = "上傳失敗：" + err.message;
      }
    }

    document.getElementById('importNsl').addEventListener('click', () => {
      uploadQuestions('questions_nsl', sampleNslQuestions);
    });
  </script>
</body>
</html>
