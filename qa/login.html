<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>問答平台 - 參與者登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
    <button onclick="window.location.href='Q_A.html'" class="text-slate-400 hover:text-white text-sm mb-4 inline-block">← 返回主題選擇</button>
    <h1 class="text-2xl font-bold text-center text-sky-400 mb-2">參與者登入</h1>
    <p id="target-quiz-text" class="text-center text-slate-300 text-sm font-semibold mb-6"></p>
    
    <!-- 正式登入表單 -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">名字 (5-10位英數字，無空格符號)</label>
        <input type="text" id="username" required pattern="[a-zA-Z0-9]{5,10}" title="名字必須由 5 至 10 個英文字母或數字組成，不能有空格或符號" placeholder="例如: Alex88" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-sky-500">
      </div>
      <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-500 rounded-lg font-bold text-white transition">
        登入並開始測驗 (可記錄最多20次結果)
      </button>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700"></div></div>
      <div class="relative flex justify-center text-sm"><span class="px-2 bg-slate-800 text-slate-400">或</span></div>
    </div>

    <!-- Guest 登入區塊 -->
    <div class="text-center">
      <button onclick="handleGuestLogin()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold text-slate-200 transition border border-slate-600">
        以 Guest (訪客) 身分直接開始
      </button>
      <p class="text-xs text-amber-400 mt-2 font-medium">⚠️ 若選用 Guest login，答題結果將不會被紀錄。</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const target = urlParams.get('target') || 'nsl';

    const targetText = document.getElementById('target-quiz-text');
    if (target === 'bl') {
      targetText.innerText = '即將進入：香港基本法問答';
    } else {
      targetText.innerText = '即將進入：香港國安法問答';
    }

    function handleLogin(e) {
      e.preventDefault();
      const name = document.getElementById('username').value;
      const email = document.getElementById('email').value;

      const user = { name, email, isGuest: false };
      localStorage.setItem('currentUser', JSON.stringify(user));
      window.location.href = target + '.html';
    }

    function handleGuestLogin() {
      const user = { name: 'Guest', email: 'guest@local', isGuest: true };
      localStorage.setItem('currentUser', JSON.stringify(user));
      window.location.href = target + '.html';
    }
  </script>
</body>
</html>
