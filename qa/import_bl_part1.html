                    question_text: "根據《香港基本法》第三十九條，《公民權利和政治權利國際公約》、《經濟、社會與文化權利的國際公約》和國際勞工公約適用於香港的有關規定繼續有效，通過什麼方式予以實施？",
                    options: { A: "香港特別行政區的法律", B: "全國性法律", C: "行政長官命令", D: "國際法庭裁決" },
                    correct_answer: "A"
                },
                {
                    id: 40, article_number: 40, question_type: "composite",
                    question_text: "根據《香港基本法》第四十條，“新界”原居民的哪些傳統權益受香港特別行政區的保護？ 1. 土地權益 2. 丁屋權益 3. 合法傳統權益 4. 政治特權",
                    options: { A: "1, 2", B: "1, 3", C: "3", D: "1, 2, 3" },
                    correct_answer: "C" // 註：原文為「“新界”原居民的合法傳統權益受香港特別行政區的保護」。
                }
            ];
        }

        // 預覽按鈕事件
        document.getElementById('previewBtn').addEventListener('click', function() {
            const resultCard = document.getElementById('resultCard');
            const statusAlert = document.getElementById('statusAlert');
            const jsonOutput = document.getElementById('jsonOutput');

            resultCard.style.display = 'block';
            statusAlert.style.display = 'none';
            document.getElementById('resultTitle').textContent = "第 1 批資料預覽 (完整 40 題)：";

            const data = getPart1Questions();
            jsonOutput.textContent = JSON.stringify(data, null, 4);
        });

        // 提交匯入事件
        document.getElementById('importForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const apiUrl = document.getElementById('apiUrl').value;
            const resultCard = document.getElementById('resultCard');
            const statusAlert = document.getElementById('statusAlert');
            const jsonOutput = document.getElementById('jsonOutput');

            resultCard.style.display = 'block';
            statusAlert.style.display = 'block';
            statusAlert.className = "alert alert-warning";
            statusAlert.textContent = "正在傳送完整的第 1 批資料 (1-40題) 至伺服器...";

            const payload = {
                batch: 1,
                range: "1-40",
                database: "questions_bl",
                questions: getPart1Questions()
            };

            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error('伺服器回應錯誤 (HTTP ' + response.status + ')');
                return response.json();
            })
            .then(data => {
                statusAlert.className = "alert alert-success";
                statusAlert.textContent = "第 1 批 40 題已成功匯入！";
                jsonOutput.textContent = JSON.stringify(data, null, 4);
            })
            .catch(error => {
                // 若無實際後端，提供模擬成功結果以利測試
                statusAlert.className = "alert alert-danger";
                statusAlert.textContent = `無法連線至後端 (${error.message})。以下為本地模擬成功回應：`;
                
                const mockResponse = {
                    status: "success",
                    message: "【模擬模式】第 1 批 40 條真實題目已成功寫入 `questions_bl`！",
                    imported_count: 40,
                    timestamp: new Date().toISOString(),
                    first_question_preview: payload.questions[0].question_text,
                    last_question_preview: payload.questions[39].question_text
                };
                jsonOutput.textContent = JSON.stringify(mockResponse, null, 4);
            });
        });
    </script>
</body>
</html>
