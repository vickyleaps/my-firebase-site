<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>題目批量匯入工具</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
    button { padding: 10px 15px; margin: 5px; font-weight: bold; cursor: pointer; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Firestore 題目庫批量匯入</h2>
  <button id="importNslBtn">匯入 香港國安法 題目庫</button>
  <button id="importBlBtn">匯入 香港基本法 題目庫</button>

  <div id="status"></div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- 1. 國安法預設題目 ---
    const nslQuestions = [
      {
        id: "q001",
        question: "根據《香港國安法》第一條，制定本法的目的是為了維護國家安全，防範、制止和懲治與香港特別行政區有關的哪些犯罪？",
        options: {
          A: "分裂國家、顛覆國家政權、組織實施恐怖活動、勾結外國或者境外勢力危害國家安全",
          B: "盜竊、詐騙、洗黑錢、貪污",
          C: "非法集結、強盜、縱火、毀壞公物",
          D: "走私、販毒、非法入境、網路犯罪"
        },
        answer: "A"
      },
      {
        id: "q002",
        question: "《香港國安法》規定，香港特別行政區維護國家安全委員會（國安委）由誰擔任主席？",
        options: {
          A: "律政司司長",
          B: "香港特別行政區行政長官",
          C: "警務處處長",
          D: "保安局局長"
        },
        answer: "B"
      }
    ];

    // --- 2. 基本法預設題目 ---
    const blQuestions = [
      {
        id: "q001",
        question: "根據《基本法》第一條，香港特別行政區是什麼的不可分離的部分？",
        options: {
          A: "中華人民共和國",
          B: "聯合國",
          C: "廣東省",
          D: "英聯邦"
        },
        answer: "A"
      },
      {
        id: "q002",
        question: "根據《基本法》第五條，香港特別行政區不實行社會主義制度和政策，保持原有的資本主義制度和生活方式，多少年不變？",
        options: {
          A: "三十年",
          B: "五十載（五十年）",
          C: "七十年",
          D: "一百年"
        },
        answer: "B"
      }
    ];

    // --- 3. 匯入邏輯 ---
    async function importData(collectionName, dataList) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = "blue";
      statusDiv.innerText = `正在匯入至 ${collectionName}...`;

      try {
        for (const item of dataList) {
          const { id, ...data } = item;
          await setDoc(doc(db, collectionName, id), data);
        }
        statusDiv.style.color = "green";
        statusDiv.innerText = `上傳成功！已成功匯入至 ${collectionName}（共 ${dataList.length} 題）`;
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "上傳失敗：" + err.message;
      }
    }

    // 綁定國安法按鈕
    document.getElementById('importNslBtn').addEventListener('click', () => {
      importData('questions_nsl', nslQuestions);
    });

    // 綁定基本法按鈕
    document.getElementById('importBlBtn').addEventListener('click', () => {
      importData('questions_bl', blQuestions);
    });
  </script>
</body>
</html>
