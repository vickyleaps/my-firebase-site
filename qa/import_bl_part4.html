      { id: 160, article: 160, type: "multiple", question: "根據《香港基本法》第一百六十條，香港原有法律（即普通法、衡平法、條例、附屬立法和習慣法）的處理原則為：① 採用為香港特區法律 ② 除非同本法相抵觸或經香港特區的立法會或其他機關作修改 ③ 所有原有法律一律自動廢除，全部重新訂立", options: { A: "僅 ①②", B: "僅 ②③", C: "僅 ①③", D: "①、②和③" }, answer: "A", explanation: "香港原有法律予以採納為特區法律，除非同本法相抵觸或經立法會修改。" }

    async function importData() {
      const statusEl = document.getElementById('status');
      const progressBar = document.getElementById('progress-bar');
      const total = questions.length;
      
      try {
        for (let i = 0; i < total; i++) {
          let q = questions[i];
          statusEl.innerText = `正在寫入第 ${i + 1} / ${total} 筆資料 (q_${q.id})...`;
          
          await setDoc(doc(db, "questions_bl", `q_${q.id}`), q);
          
          let percent = ((i + 1) / total) * 100;
          progressBar.style.width = percent + "%";
        }
        statusEl.innerText = "全部寫入成功！第 121-160 條（答案平衡版）已順利更新至 Firestore。";
        progressBar.style.background = "#2196F3";
      } catch (error) {
        console.error("寫入錯誤：", error);
        statusEl.innerText = "寫入失敗：" + error.message;
        progressBar.style.background = "#f44336";
      }
    }
    
    importData();
  </script>
