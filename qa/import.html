<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫資料匯入工具 - Firestore Batch Import</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      color: #38bdf8;
      border-bottom: 2px solid #334155;
      padding-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    button {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1.5rem;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #059669;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 0.5rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>題庫洗牌與 Firebase 匯入工具</h1>
    <p>此工具將生成基本法（200題）與國安法（200題）之題庫，並進行隨機洗牌，最後寫入 Firestore 中。</p>
    
    <button id="importBtn" onclick="startImport()">🚀 開始洗牌並寫入至 Firestore</button>

    <div id="status">準備就緒，請點擊上方按鈕開始...</div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateQuestionBank(type, name) {
      const bank = [];

      for (let i = 1; i <= 130; i++) {
        const correctIndex = Math.floor(Math.random() * 4);
        const answerKey = ['A', 'B', 'C', 'D'][correctIndex];

        const baseOpts = [
          `落實特區維護國家安全的法律制度與執行機制`,
          `遵循國際人權公約適用於特區的相關規定`,
          `保障行政、立法與司法機關依法獨立行使職權`,
          `維護中華人民共和國憲法與特區基本法確立的憲制秩序`
        ];

        const shuffledOpts = [...baseOpts];
        shuffleArray(shuffledOpts);

        bank.push({
          question: `關於《${name}》相關規定與實施範疇，下列哪項敘述完全正確？`,
          options: {
            A: `(1) ${shuffledOpts[0]}`,
            B: `(2) ${shuffledOpts[1]}`,
            C: `(3) ${shuffledOpts[2]}`,
            D: `(4) ${shuffledOpts[3]}`
          },
          answer: answerKey
        });
      }

      for (let i = 1; i <= 70; i++) {
        const comboKeys = ['A', 'B', 'C', 'D'];
        const answerKey = comboKeys[Math.floor(Math.random() * comboKeys.length)];

        bank.push({
          question: `根據《${name}》相關規範，下列哪些屬於維護特區法治與憲制秩序之重要原則？\n(1) 依法保障居民基本權利與自由\n(2) 遵循罪刑法定與無罪推定原則\n(3) 獨立的司法權和終審權\n(4) 任何機構與個人皆須遵守法律`,
          options: {
            A: '(1)(2)(3)',
            B: '(1)(2)(4)',
            C: '(2)(3)(4)',
            D: '(1)(2)(3)(4)'
          },
          answer: answerKey
        });
      }

      shuffleArray(bank);

      return bank.map((q, index) => ({
        id: index + 1,
        question: q.question,
        options: q.options,
        answer: q.answer
      }));
    }

    // 帶 Timeout 的寫入包裝，防止卡死
    function setDocWithTimeout(docRef, data, timeoutMs = 5000) {
      return Promise.race([
        setDoc(docRef, data),
        new Promise((_, reject) => 
          setTimeout(() => reject(new Error("寫入超時！請檢查 Firebase Rules 權限設定")), timeoutMs)
        )
      ]);
    }

    window.startImport = async function() {
      const btn = document.getElementById('importBtn');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      status.innerText = "🚀 開始生成題目並進行洗牌...\n";

      try {
        const blQuestions = generateQuestionBank('bl', '香港基本法');
        const nslQuestions = generateQuestionBank('nsl', '香港國安法');

        status.innerText += `[✓] 洗牌完成！準備寫入 Firestore...\n\n`;

        status.innerText += `👉 寫入 基本法 (questions_bl)...\n`;
        for (let i = 0; i < blQuestions.length; i++) {
          const q = blQuestions[i];
          await setDocWithTimeout(doc(db, "questions_bl", String(q.id)), q);
          if ((i + 1) % 20 === 0 || i === blQuestions.length - 1) {
            status.innerText += `   - 基本法進度：${i + 1} / 200 題\n`;
          }
        }

        status.innerText += `\n👉 寫入 國安法 (questions_nsl)...\n`;
        for (let i = 0; i < nslQuestions.length; i++) {
          const q = nslQuestions[i];
          await setDocWithTimeout(doc(db, "questions_nsl", String(q.id)), q);
          if ((i + 1) % 20 === 0 || i === nslQuestions.length - 1) {
            status.innerText += `   - 國安法進度：${i + 1} / 200 題\n`;
          }
        }

        status.innerText += "\n🎉 所有題庫已成功更新！";
        status.style.borderColor = "#10b981";

      } catch (error) {
        console.error("匯入失敗：", error);
        status.innerText += `\n❌ 匯入失敗：${error.message}`;
        status.style.borderColor = "#ef4444";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
