<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>題目批量匯入工具</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
    button { padding: 12px 20px; margin: 5px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; background: #0284c7; color: white; }
    button:hover { background: #0369a1; }
    #status { margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
  </style>
</head>
<body>
  <h2>Firestore 題目庫批量匯入</h2>
  <button id="importNslBtn">匯入 香港國安法 題目庫 (15題)</button>
  <button id="importBlBtn" style="background:#0f9f90;">匯入 香港基本法 題目庫 (15題)</button>

  <div id="status"></div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- 1. 國安法預設題目 (15題) ---
    const nslQuestions = [
      { id: "q001", question: "根據《香港國安法》第一條，制定本法的目的是為了維護國家安全，防範、制止和懲治與香港特別行政區有關的哪些犯罪？", options: { A: "分裂國家、顛覆國家政權、組織實施恐怖活動、勾結外國或者境外勢力危害國家安全", B: "盜竊、詐騙、洗黑錢、貪污", C: "非法集結、強盜、縱火、毀壞公物", D: "走私、販毒、非法入境、網路犯罪" }, answer: "A" },
      { id: "q002", question: "《香港國安法》規定，香港特別行政區維護國家安全委員會（國安委）由誰擔任主席？", options: { A: "律政司司長", B: "香港特別行政區行政長官", C: "警務處處長", D: "保安局局長" }, answer: "B" },
      { id: "q003", question: "根據《香港國安法》，國安委作出的決定是否受司法覆核？", options: { A: "不受司法覆核，且資訊不予公開", B: "可以由終審法院進行司法覆核", C: "須經立法會批准後方可覆核", D: "可由高等法院原訟法庭覆核" }, answer: "A" },
      { id: "q004", question: "《香港國安法》規定，警務處維護國家安全部門負責人由誰任命？", options: { A: "中央人民政府", B: "行政長官在徵求駐港國安公署意見後任命", C: "立法會主席", D: "警務處處長自行任命" }, answer: "B" },
      { id: "q005", question: "根據《香港國安法》，香港法院審理危害國家安全犯罪案件指定法官任期為多久？", options: { A: "半年", B: "一年", C: "三年", D: "終身任期" }, answer: "B" },
      { id: "q006", question: "根據《香港國安法》，香港特別行政區維護國家安全委員會設國家安全事務顧問，由誰指派？", options: { A: "行政長官", B: "中央人民政府", C: "全國人大常委會", D: "外交部" }, answer: "B" },
      { id: "q007", question: "根據《香港國安法》，為不公開審理的案件作出決定的機構或人員是？", options: { A: "律政司司長發出證書", B: "陪審團投票決定", C: "警務處處長發出通知", D: "立法會通過" }, answer: "A" },
      { id: "q008", question: "《香港國安法》規定，中央人民政府在香港特別行政區設立的維護國家安全機構名稱為？", options: { A: "中央駐港聯絡辦公室", B: "中央人民政府駐香港特別行政區維護國家安全公署", C: "外交部駐港特派員公署", D: "解放軍駐港部隊" }, answer: "B" },
      { id: "q009", question: "根據《香港國安法》，駐港國安公署人員執行職務時的費用由誰承擔？", options: { A: "香港特別行政區政府", B: "中央財政保障", C: "國安委專項基金", D: "社會捐贈" }, answer: "B" },
      { id: "q010", question: "《香港國安法》的解釋權屬於哪個機構？", options: { A: "香港特別行政區終審法院", B: "全國人民代表大會常務委員會", C: "香港特別行政區立法會", D: "中央人民政府" }, answer: "B" },
      { id: "q101", question: "【多選組合】根據《香港國安法》，以下哪些屬於國安委的職責？\n(1) 分析研判香港維護國安形勢\n(2) 制定香港維護國安政策\n(3) 推進香港維護國安法律制度建設\n(4) 直接對犯人進行審判", options: { A: "(1)(2)(3)", B: "(1)(2)(4)", C: "(2)(3)(4)", D: "(1)(3)(4)" }, answer: "A" },
      { id: "q102", question: "【多選組合】根據《香港國安法》，駐港國安公署職責包括哪些？\n(1) 分析研判國安形勢並提出意見建議\n(2) 監督、指導、協調、支援香港履行國安職責\n(3) 收集分析國安情報\n(4) 依法辦理危害國安犯罪案件", options: { A: "僅(1)(2)", B: "僅(1)(2)(3)", C: "僅(2)(3)(4)", D: "(1)(2)(3)(4)" }, answer: "D" },
      { id: "q103", question: "【多選組合】根據《香港國安法》，香港特區維護國家安全應當遵循哪些原則？\n(1) 尊重和保障人權\n(2) 堅持法治原則\n(3) 罪刑法定與無罪推定\n(4) 保護當事人的訴訟權利", options: { A: "僅(1)(2)", B: "僅(1)(2)(3)", C: "僅(2)(3)(4)", D: "(1)(2)(3)(4)" }, answer: "D" },
      { id: "q104", question: "【多選組合】根據《香港國安法》，哪些人任職時應當依法宣誓或簽署書面文件擁護基本法、效忠特區？\n(1) 參選或出任議員\n(2) 就任特區公職人員\n(3) 司法人員\n(4) 行政長官及主要官員", options: { A: "僅(1)(2)", B: "僅(1)(2)(3)", C: "僅(2)(3)(4)", D: "(1)(2)(3)(4)" }, answer: "D" },
      { id: "q105", question: "【多選組合】根據《香港國安法》，關於國安委的運作，以下哪些說法正確？\n(1) 國安委的工作不受特區任何其他機構、組織和個人的干涉\n(2) 國安委工作資訊不予公開\n(3) 國安委作出的決定不受司法覆核\n(4) 國安委決定需經立法會三讀通過", options: { A: "(1)(2)(3)", B: "(1)(2)(4)", C: "(2)(3)(4)", D: "(1)(3)(4)" }, answer: "A" }
    ];

    // --- 2. 基本法預設題目 (15題) ---
    const blQuestions = [
      { id: "q001", question: "根據《基本法》第一條，香港特別行政區是什麼的不可分離的部分？", options: { A: "中華人民共和國", B: "聯合國", C: "廣東省", D: "英聯邦" }, answer: "A" },
      { id: "q002", question: "根據《基本法》第五條，香港特別行政區不實行社會主義制度和政策，保持原有的資本主義制度和生活方式，多少年不變？", options: { A: "三十年", B: "五十載（五十年）", C: "七十年", D: "一百年" }, answer: "B" },
      { id: "q003", question: "根據《基本法》第二十六條，香港特別行政區永久性居民依法享有什麼權利？", options: { A: "外交權", B: "選舉權和被選舉權", C: "國防指揮權", D: "宣戰權" }, answer: "B" },
      { id: "q004", question: "根據《基本法》第一百一十一條，香港特別行政區的法定貨幣是什麼？", options: { A: "人民幣", B: "港元", C: "美元", D: "英鎊" }, answer: "B" },
      { id: "q005", question: "根據《基本法》，香港特別行政區的全國性法律列於哪一個附件中？", options: { A: "附件一", B: "附件二", C: "附件三", D: "附件四" }, answer: "C" },
      { id: "q006", question: "根據《基本法》，香港特別行政區行政長官對誰負責？", options: { A: "僅對香港特別行政區立法會負責", B: "中央人民政府和香港特別行政區", C: "僅對終審法院首席法官負責", D: "僅對國務院港澳辦負責" }, answer: "B" },
      { id: "q007", question: "根據《基本法》第十二條，香港特別行政區是一個享有高度自治權的地方行政區域，直轄於誰？", options: { A: "全國人民代表大會常務委員會", B: "中央人民政府（國務院）", C: "外交部", D: "國防部" }, answer: "B" },
      { id: "q008", question: "根據《基本法》，香港特別行政區的終審權屬於哪個機構？", options: { A: "中華人民共和國最高人民法院", B: "香港特別行政區終審法院", C: "全國人大常委會", D: "高等法院上訴法庭" }, answer: "B" },
      { id: "q009", question: "根據《基本法》第一百零六條，香港特別行政區保持財政獨立，其稅收情況為？", options: { A: "全部上繳中央人民政府", B: "按比例上繳中央人民政府", C: "不上繳中央人民政府", D: "由中央定額徵收" }, answer: "C" },
      { id: "q010", question: "根據《基本法》第一百五十八條，本法的解釋權屬於哪個機構？", options: { A: "香港特別行政區終審法院", B: "全國人民代表大會常務委員會", C: "香港特別行政區立法會", D: "律政司" }, answer: "B" },
      { id: "q101", question: "【多選組合】根據《基本法》第二條，全國人大授權香港實行高度自治，享有以下哪些權利？\n(1) 行政管理權\n(2) 立法權\n(3) 獨立的司法權和終審權\n(4) 外交與國防權", options: { A: "(1)(2)(3)", B: "(1)(2)(4)", C: "(2)(3)(4)", D: "(1)(3)(4)" }, answer: "A" },
      { id: "q102", question: "【多選組合】根據《基本法》第四十八條，香港行政長官行使的職權包括哪些？\n(1) 領導香港特別行政區政府\n(2) 負責執行基本法和適用於香港的其他法律\n(3) 簽署立法會通過的法案並公布法律\n(4) 提名並報請中央政府任命主要官員", options: { A: "僅(1)(2)", B: "僅(1)(2)(3)", C: "僅(2)(3)(4)", D: "(1)(2)(3)(4)" }, answer: "D" },
      { id: "q103", question: "【多選組合】根據《基本法》第三章，香港居民享有以下哪些基本權利和自由？\n(1) 言論、新聞、出版的自由\n(2) 結社、集會、遊行、示威的自由\n(3) 宗教信仰自由與通信自由\n(4) 人身自由不受非法逮捕或拘留", options: { A: "僅(1)(2)", B: "僅(1)(2)(3)", C: "僅(2)(3)(4)", D: "(1)(2)(3)(4)" }, answer: "D" },
      { id: "q104", question: "【多選組合】根據《基本法》，中央人民政府負責管理香港特別行政區的哪些事務？\n(1) 外交事務\n(2) 防務（國防）事務\n(3) 任命行政長官和主要官員\n(4) 香港內部治安與警務日常管理", options: { A: "(1)(2)(3)", B: "(1)(2)(4)", C: "(2)(3)(4)", D: "(1)(3)(4)" }, answer: "A" },
      { id: "q105", question: "【多選組合】根據《基本法》，關於香港的經濟與金融制度，以下哪些說法正確？\n(1) 保持自由港地位，實行自由貿易政策\n(2) 不實行外匯管制政策，港幣自由兌換\n(3) 實行低稅率政策\n(4) 保持財政獨立，預算以量入為出為原則", options: { A: "僅(1)(2)", B: "僅(1)(2)(3)", C: "僅(2)(3)(4)", D: "(1)(2)(3)(4)" }, answer: "D" }
    ];

    // --- 3. 匯入邏輯 ---
    async function importData(collectionName, dataList) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = "blue";
      statusDiv.innerText = `正在匯入至 ${collectionName}...`;

      try {
        for (const item of dataList) {
          const { id, ...data } = item;
          await setDoc(doc(db, collectionName, id), data);
        }
        statusDiv.style.color = "green";
        statusDiv.innerText = `上傳成功！已成功匯入至 ${collectionName}（共 ${dataList.length} 題）`;
      } catch (err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "上傳失敗：" + err.message;
      }
    }

    document.getElementById('importNslBtn').addEventListener('click', () => {
      importData('questions_nsl', nslQuestions);
    });

    document.getElementById('importBlBtn').addEventListener('click', () => {
      importData('questions_bl', blQuestions);
    });
  </script>
</body>
</html>
