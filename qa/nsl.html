<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港國安法 - 知識測驗</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <div id="quiz-card" class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-700">
    <button onclick="window.history.back()" class="text-slate-400 hover:text-white text-sm mb-4 inline-block">← 返回</button>
    <h1 class="text-2xl font-bold text-center text-sky-400 mb-2">香港國安法問答題</h1>
    <p id="user-info" class="text-center text-slate-400 text-sm mb-6"></p>

    <!-- 題目區域 -->
    <div id="question-container" class="space-y-6">
      <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
        <h2 id="question-text" class="text-lg font-semibold text-slate-100 whitespace-pre-line">載入題目中...</h2>
      </div>

      <!-- 選項區域 -->
      <div id="options-container" class="space-y-3"></div>

      <button id="next-btn" onclick="submitAnswer()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 rounded-lg font-bold text-white transition duration-200 mt-4">
        下一題
      </button>
    </div>

    <!-- 結果區域 -->
    <div id="result-container" class="hidden text-center space-y-6">
      <h2 class="text-3xl font-bold text-sky-400">測驗完成！</h2>
      <p id="score-text" class="text-2xl font-semibold"></p>
      <button onclick="window.history.back()" class="w-full py-3 bg-sky-600 hover:bg-sky-500 rounded-lg font-bold text-white transition">
        返回
      </button>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 安全讀取使用者資訊，若無資料則給予預設訪客身份，防止 404 導頁
    let currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
      currentUser = { name: "訪客", email: "guest@vickyleaps.com" };
    }
    document.getElementById('user-info').innerText = `參與者：${currentUser.name} (${currentUser.email})`;

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;

    async function loadQuestions() {
      try {
        const querySnapshot = await getDocs(collection(db, "questions_nsl"));
        let singleList = [];
        let comboList = [];

        querySnapshot.forEach((doc) => {
          const data = { id: doc.id, ...doc.data() };
          if (doc.id.startsWith('q1')) {
            comboList.push(data);
          } else {
            singleList.push(data);
          }
        });

        singleList.sort(() => Math.random() - 0.5);
        comboList.sort(() => Math.random() - 0.5);

        questions = [...singleList.slice(0, 10), ...comboList.slice(0, 5)];
        
        if (questions.length === 0) {
          document.getElementById('question-text').innerText = "題庫中無可用題目，請先進行匯入。";
          document.getElementById('next-btn').classList.add('hidden');
          return;
        }

        renderQuestion();
      } catch (err) {
        console.error(err);
        document.getElementById('question-text').innerText = "載入題目失敗：" + err.message;
      }
    }

    function renderQuestion() {
      selectedOption = null;
      const q = questions[currentIndex];
      
      document.getElementById('question-text').innerText = `第 ${currentIndex + 1} 題：${q.question}`;

      const nextBtn = document.getElementById('next-btn');
      if (currentIndex === questions.length - 1) {
        nextBtn.innerText = "提交最後一條答案，完成問答";
        nextBtn.classList.remove('bg-sky-600', 'hover:bg-sky-500');
        nextBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
      } else {
        nextBtn.innerText = "下一題";
        nextBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
        nextBtn.classList.add('bg-sky-600', 'hover:bg-sky-500');
      }

      const optionsDiv = document.getElementById('options-container');
      optionsDiv.innerHTML = '';

      const keys = ['A', 'B', 'C', 'D'];
      keys.forEach(key => {
        if (q.options && q.options[key]) {
          const btn = document.createElement('div');
          btn.className = "flex items-center space-x-3 p-3 bg-slate-700/40 hover:bg-slate-700 border border-slate-600 rounded-lg cursor-pointer transition";
          btn.onclick = () => selectOption(key, btn);
          btn.innerHTML = `
            <input type="radio" name="option" value="${key}" class="w-4 h-4 text-sky-500">
            <span class="text-slate-200">${key}. ${q.options[key]}</span>
          `;
          optionsDiv.appendChild(btn);
        }
      });
    }

    function selectOption(key, element) {
      selectedOption = key;
      document.querySelectorAll('#options-container > div').forEach(el => {
        el.classList.remove('bg-sky-900/50', 'border-sky-500');
        el.classList.add('bg-slate-700/40', 'border-slate-600');
        el.querySelector('input').checked = false;
      });
      element.classList.remove('bg-slate-700/40', 'border-slate-600');
      element.classList.add('bg-sky-900/50', 'border-sky-500');
      element.querySelector('input').checked = true;
    }

    window.submitAnswer = async function() {
      if (!selectedOption) {
        alert('請先選擇一個答案！');
        return;
      }

      if (selectedOption === questions[currentIndex].answer) {
        score++;
      }

      currentIndex++;

      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        await finishQuiz();
      }
    };

    async function finishQuiz() {
      document.getElementById('question-container').classList.add('hidden');
      document.getElementById('result-container').classList.remove('hidden');
      document.getElementById('score-text').innerText = `你的得分：${score} / ${questions.length}`;

      try {
        await addDoc(collection(db, "history"), {
          userEmail: currentUser.email,
          userName: currentUser.name,
          quizType: "香港國安法",
          score: score,
          totalQuestions: questions.length,
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error("寫入歷史紀錄失敗：", err);
      }
    }

    loadQuestions();
  </script>
</body>
</html>
