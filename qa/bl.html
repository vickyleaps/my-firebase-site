<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港基本法問答題</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center p-4">

  <div class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-2xl border border-slate-700 space-y-6">
    
    <div class="flex justify-between items-center text-sm text-slate-400">
      <button onclick="window.location.href='login.html?target=bl'" class="hover:text-white">← 切換使用者</button>
      <div id="user-display"></div>
    </div>

    <h1 class="text-2xl font-bold text-center text-emerald-400">香港基本法問答題</h1>

    <div class="bg-slate-700/50 p-5 rounded-xl border border-slate-600">
      <h2 id="question-title" class="text-lg font-semibold text-slate-100 whitespace-pre-line mb-2">載入題目中...</h2>
    </div>

    <div id="options-container" class="space-y-3"></div>

    <button id="next-btn" onclick="handleNextQuestion()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold text-white transition hidden">
      下一題
    </button>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedAnswer = null;
    let wrongAnswers = [];

    const currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: '訪客', email: 'guest@local', isGuest: true };
    document.getElementById('user-display').innerText = `參與者：${currentUser.name} (${currentUser.email})`;

    async function loadQuestions() {
      try {
        const querySnapshot = await getDocs(collection(db, "questions_bl"));
        querySnapshot.forEach((doc) => {
          questions.push(doc.data());
        });

        questions.sort(() => Math.random() - 0.5);
        questions = questions.slice(0, 15);

        renderQuestion();
      } catch (err) {
        document.getElementById('question-title').innerText = "載入題目失敗：" + err.message;
      }
    }

    function renderQuestion() {
      selectedAnswer = null;
      const nextBtn = document.getElementById('next-btn');
      nextBtn.classList.add('hidden');

      if (currentIndex >= questions.length) {
        finishQuiz();
        return;
      }

      const q = questions[currentIndex];
      const cleanQuestion = q.question.replace(/\[(單選|複選)\s*Q?\d+\]\s*/gi, '');
      document.getElementById('question-title').innerText = `第 ${currentIndex + 1} 題：${cleanQuestion}`;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      Object.keys(q.options).sort().forEach(key => {
        const optBtn = document.createElement('button');
        optBtn.className = "w-full text-left p-4 rounded-xl bg-slate-700/80 hover:bg-slate-600 border border-slate-600 flex items-center space-x-3 transition";
        optBtn.innerHTML = `<span class="w-6 h-6 rounded-full border border-slate-400 flex items-center justify-center text-xs font-bold">${key}</span> <span>${q.options[key]}</span>`;
        
        optBtn.onclick = () => {
          document.querySelectorAll('#options-container button').forEach(b => b.classList.remove('border-emerald-500', 'bg-emerald-950/40'));
          optBtn.classList.add('border-emerald-500', 'bg-emerald-950/40');
          selectedAnswer = key;
          nextBtn.classList.remove('hidden');
          nextBtn.innerText = currentIndex === questions.length - 1 ? "提交答案，完成問答" : "下一題";
        };

        container.appendChild(optBtn);
      });
    }

    window.handleNextQuestion = async function() {
      const q = questions[currentIndex];
      const cleanQ = q.question.replace(/\[(單選|複選)\s*Q?\d+\]\s*/gi, '');

      if (selectedAnswer === q.answer) {
        score++;
      } else {
        wrongAnswers.push({
          num: currentIndex + 1,
          title: cleanQ,
          options: q.options,
          userAns: selectedAnswer,
          correctAns: q.answer
        });
      }

      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        await finishQuiz();
      }
    };

    window.toggleWrongAnswers = function() {
      const list = document.getElementById('wrong-answers-list');
      if (list) {
        list.classList.toggle('hidden');
      }
    };

    async function finishQuiz() {
      const container = document.querySelector('.space-y-6');

      let wrongHtml = '';
      if (wrongAnswers.length > 0) {
        wrongHtml = `
          <div>
            <button onclick="toggleWrongAnswers()" class="text-emerald-400 hover:text-emerald-300 underline font-medium cursor-pointer py-1 text-sm">
              🔍 查看答錯的題目 (${wrongAnswers.length} 題)
            </button>
          </div>
          <div id="wrong-answers-list" class="hidden text-left space-y-4 mt-4 max-h-[50vh] overflow-y-auto pr-2">
            ${wrongAnswers.map(item => `
              <div class="bg-slate-700/60 p-4 rounded-xl border border-slate-600 space-y-2">
                <div class="font-semibold text-slate-100 text-base">第 ${item.num} 題：${item.title}</div>
                <div class="text-sm text-rose-400 font-medium">
                  ✖ 你的答案：(${item.userAns}) ${item.options[item.userAns]}
                </div>
                <div class="text-sm text-emerald-400 font-semibold">
                  ✓ 正確答案：(${item.correctAns}) ${item.options[item.correctAns]}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        wrongHtml = `<p class="text-emerald-400 font-semibold text-lg">🎉 太厲害了！全對！</p>`;
      }

      container.innerHTML = `
        <div class="text-center py-6 space-y-4">
          <h2 class="text-3xl font-extrabold text-emerald-400">測驗完成！</h2>
          <p class="text-xl text-slate-200">得分：<span class="text-emerald-400 font-bold text-2xl">${score}</span> / ${questions.length}</p>
          
          ${wrongHtml}

          <div class="pt-4">
            <button onclick="window.location.href='login.html?target=bl'" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-bold transition">返回首頁</button>
          </div>
        </div>
      `;

      if (!currentUser.isGuest) {
        try {
          await addDoc(collection(db, "history"), {
            userName: currentUser.name,
            userEmail: currentUser.email,
            quizType: "香港基本法",
            score: score,
            totalQuestions: questions.length,
            timestamp: serverTimestamp()
          });
        } catch (e) {
          console.error("儲存紀錄失敗:", e);
        }
      }
    }

    loadQuestions();
  </script>
</body>
</html>
